<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b090a" />
    <meta name="description" content="Hugoweston 的猜数字小游戏，体验 Python 作品的浏览器版本。" />
    <title>猜数字小游戏 · HUGOWESTON</title>
    <link rel="stylesheet" href="./game.css" />
    <script src="./game.js" defer></script>
  </head>
  <body>
    <div class="game-shell">
      <header class="game-header">
        <a class="brand" href="../../"><span>H.</span> HUGOWESTON</a>
        <a class="back-link" href="../../#projects">返回作品集 <span aria-hidden="true">↗</span></a>
      </header>

      <main class="game-main">
        <section class="game-intro" aria-labelledby="game-title">
          <p class="eyebrow"><span class="status-dot"></span> PYTHON MINI GAME <span class="divider">/</span> 01</p>
          <h1 id="game-title">猜个<span>数字</span><i>.</i></h1>
          <p class="intro-copy">我已经想好一个 1 到 100 之间的数字。试着猜中它，看看你需要几次。</p>
          <div class="range-markers" aria-label="数字范围"><span>01</span><span class="range-line"></span><span>100</span></div>
        </section>

        <section class="play-panel" aria-label="猜数字游戏">
          <div class="panel-top"><span>GUESS / INPUT</span><span id="round-label">ROUND 01</span></div>
          <form id="guess-form" novalidate>
            <label for="guess-input">输入你的猜测</label>
            <div class="input-row">
              <input id="guess-input" name="guess" type="number" min="1" max="100" step="1" inputmode="numeric" placeholder="?" autocomplete="off" aria-describedby="input-hint feedback" />
              <button class="submit-button" type="submit"><span>确认</span><b aria-hidden="true">→</b></button>
            </div>
            <p class="input-hint" id="input-hint">请输入 1–100 之间的整数</p>
          </form>

          <div class="feedback" id="feedback" role="status" aria-live="polite">
            <span class="feedback-index">READY</span>
            <strong>等你来猜</strong>
          </div>

          <div class="panel-bottom">
            <div class="attempt-counter"><strong id="attempt-count">00</strong><span>次尝试</span></div>
            <button class="restart-button" id="restart-button" type="button">重新开始 <span aria-hidden="true">↻</span></button>
          </div>
        </section>

        <section class="history-section" aria-labelledby="history-title">
          <div class="history-heading"><h2 id="history-title">猜测记录</h2><span id="history-total">0 GUESSES</span></div>
          <ol class="guess-history" id="guess-history" aria-live="polite"></ol>
          <p class="history-empty" id="history-empty">你的每一次猜测都会出现在这里。</p>
        </section>

        <footer class="game-footer">
          <span>HUGOWESTON <i>·</i> PYTHON / 2026</span>
          <a href="./game.py" download="guess-number.py">下载 Python 源码 <span aria-hidden="true">↓</span></a>
        </footer>
      </main>
    </div>
  </body>
</html>
