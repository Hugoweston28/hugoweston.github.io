  <text x="150" y="360" font-family="Georgia,serif" font-size="260" fill="#f1efed" fill-opacity=".06" text-anchor="middle">{ }</text>
  <g font-family="monospace" font-size="20">
    <text x="150" y="330" fill="#ed3342" fill-opacity=".7">def</text>
    <text x="205" y="330" fill="#7fbcce" fill-opacity=".8">guess():</text>
