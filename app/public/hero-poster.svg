<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Studio keyboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151318"/>
      <stop offset=".55" stop-color="#0d0b0d"/>
      <stop offset="1" stop-color="#070506"/>
    </linearGradient>
    <radialGradient id="glow" cx=".74" cy=".44" r=".6">
      <stop offset="0" stop-color="#b51423" stop-opacity=".45"/>
      <stop offset="1" stop-color="#b51423" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1efed" stop-opacity=".20"/>
      <stop offset="1" stop-color="#f1efed" stop-opacity=".03"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#f1efed" stroke-opacity=".045"/>
    </pattern>
    <pattern id="noise" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" filter="url(#grain)" opacity=".22"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="keyBlur"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <ellipse cx="1420" cy="470" rx="700" ry="430" fill="#b51423" opacity=".16" filter="url(#blur)"/>

  <g filter="url(#keyBlur)" opacity=".9">
    <rect x="0" y="690" width="1920" height="330" fill="#0a0809" opacity=".55"/>
    <g fill="url(#keyBody)" stroke="#f1efed" stroke-opacity=".16">
      <rect x="5" y="700" width="150" height="380"/>
      <rect x="165" y="700" width="150" height="380"/>
      <rect x="325" y="700" width="150" height="380"/>
      <rect x="485" y="700" width="150" height="380"/>
      <rect x="645" y="700" width="150" height="380"/>
      <rect x="805" y="700" width="150" height="380"/>
      <rect x="965" y="700" width="150" height="380"/>
      <rect x="1125" y="700" width="150" height="380"/>
      <rect x="1285" y="700" width="150" height="380"/>
      <rect x="1445" y="700" width="150" height="380"/>
      <rect x="1605" y="700" width="150" height="380"/>
      <rect x="1765" y="700" width="150" height="380"/>
    </g>
    <g fill="#070506" fill-opacity=".88" stroke="#f1efed" stroke-opacity=".10">
      <rect x="110" y="700" width="90" height="250"/>
      <rect x="270" y="700" width="90" height="250"/>
      <rect x="430" y="700" width="90" height="250"/>
      <rect x="750" y="700" width="90" height="250"/>
      <rect x="910" y="700" width="90" height="250"/>
      <rect x="1230" y="700" width="90" height="250"/>
      <rect x="1390" y="700" width="90" height="250"/>
      <rect x="1550" y="700" width="90" height="250"/>
    </g>
    <rect x="965" y="700" width="150" height="380" fill="#ed3342" fill-opacity=".30" stroke="#ed3342" stroke-opacity=".55"/>
    <rect x="910" y="700" width="90" height="250" fill="#ed3342" fill-opacity=".62" stroke="#ed3342" stroke-opacity=".7"/>
  </g>

  <path d="M0 700h1920" stroke="#f1efed" stroke-opacity=".22" stroke-width="2"/>
  <text x="76" y="1000" font-family="monospace" font-size="26" fill="#f1efed" fill-opacity=".30" letter-spacing="8">PIANO / STUDIO</text>
  <text x="1844" y="1000" font-family="monospace" font-size="26" fill="#f1efed" fill-opacity=".30" letter-spacing="8" text-anchor="end">2026</text>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#noise)"/>
</svg>
